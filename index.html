<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Itask Manager</title>
  </head>
  <body>
    <main class="conteiner">
      <header class="header">
        <h1>Itask Manager</h1>
      </header>
      <!-- header -->
      <section class="adicionar_tarefa">
        <input type="text" id="titulo_tarefa" placeholder="Título da Tarefa" />
        <input type="text" id="descricao" placeholder="Descreva sua tarefa" />
        <button id="botao-do-input">Adicionar</button>
      </section>
      <!-- adicionar tarefa -->
      <section class="tarefas_adicionadas">
        <h2 class="minhas_tarefas">Minhas Tarefas</h2>
        <ul id="lista_tarefas"></ul>
        <!-- lista tarefas -->
      </section>
      <!-- tarefas adicionadas -->
    </main>
    <!-- conteiner -->
    <script src="app.js"></script>
  </body>
</html>
